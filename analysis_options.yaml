include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - lib/l10n/app_localizations*.dart
    - android/**
    - ios/**
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # App code, not a published package: API docs are optional.
    public_member_api_docs: false
    # Keep the classic `ClassName(...)` constructor syntax for readability.
    unnecessary_type_name_in_constructor: false
    # Allow `package:kfs/...` and relative imports inside lib/.
    always_use_package_imports: false
    prefer_relative_imports: false
