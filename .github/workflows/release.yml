name: Release

# Push a tag like v0.1.0 (must match `version:` in pubspec.yaml) to build the
# prod APK and publish a GitHub release with the APK and its SHA-256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check tag matches pubspec version
        run: |
          PUBSPEC_VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pubspec=$PUBSPEC_VERSION tag=$TAG_VERSION"
          test "$PUBSPEC_VERSION" = "$TAG_VERSION"

      # Release signing (optional until the keystore exists). Secrets:
      # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
      # ANDROID_KEY_PASSWORD. Without them the APK is debug-signed.
      - name: Configure release keystore
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            cat > android/key.properties <<EOF
          storeFile=app/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No release keystore configured; APK will be debug-signed (reference build only)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Prod environment values come from repository variables so real URLs
      # never live in this public repository.
      - name: Write prod environment
        env:
          STUDIO_BASE_URL: ${{ vars.STUDIO_BASE_URL_PROD }}
        run: |
          if [ -n "$STUDIO_BASE_URL" ]; then
            printf '{\n  "STUDIO_BASE_URL": "%s"\n}\n' "$STUDIO_BASE_URL" > env/prod.json
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Build prod release APK
        run: flutter build apk --release --flavor prod -t lib/main_prod.dart --dart-define-from-file=env/prod.json

      - name: Package artifacts
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APK="kfs-app-${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-prod-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 "$APK.sha256")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          APK: ${{ steps.package.outputs.apk }}
          SHA: ${{ steps.package.outputs.sha }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            SIGNING_NOTE="Signed with the release keystore."
          else
            SIGNING_NOTE="**Debug-signed reference build — not for distribution.** Configure the release keystore secrets before the pilot."
          fi
          cat > notes.md <<EOF
          $SIGNING_NOTE

          - APK: \`$APK\`
          - SHA-256: \`$SHA\`

          See CHANGELOG.md for details.
          EOF
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "KFS-APP $GITHUB_REF_NAME" --notes-file notes.md
